name: ShardGuard Scan

on:
  workflow_call:
    inputs:
      path:
        description: Path to scan
        type: string
        default: "."
  workflow_dispatch:
    inputs:
      path:
        description: Path to scan
        type: string
        default: "."

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ShardGuard
        run: pip install -e .
      - name: Scan
        run: shardguard scan "${{ inputs.path || github.event.inputs.path || '.' }}" --depth universal --report-dir shardguard-out --skip-verify
      - uses: actions/upload-artifact@v4
        with:
          name: shardguard-report
          path: shardguard-out/
