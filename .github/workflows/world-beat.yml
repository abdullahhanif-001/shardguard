name: Hidden Bypass Suite

# Maintainer-only heavy gate suite — not required for PR smoke.
# Run manually when evaluating adversarial/bypass coverage.
on:
  workflow_dispatch:

jobs:
  bypass-suite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ShardGuard
        run: pip install -e .
      - name: Bypass / hidden pipeline
        run: bash scripts/benchmark/run_world_beat.sh
